app = 'agenda-carros'
primary_region = 'gru'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PORT = '3000'
  APP_ORIGIN = 'https://agenda-carros.fly.dev'
  DB_PATH = '/data/agenda.sqlite'

[[mounts]]
  source = 'agenda_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
